<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Seequil</title>
<meta name="robots" content="noindex, nofollow, noarchive">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#1B2440">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Literata:opsz,wght@7..72,400;7..72,600&display=swap">
<style>
:root{--ink:#1B2440;--paper:#F6F3EC;--line:#E3DED2;--muted:#5A6178;--gold:#E8A33D;--blue:#1F5E8C;--amber:#8A5A12;--fs:19px}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--paper);color:var(--ink);font-family:Inter,system-ui,sans-serif}
button{font:inherit;color:inherit}
button:focus-visible,input:focus-visible,select:focus-visible,[tabindex]:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
[hidden]{display:none!important}
.icon-btn{width:44px;height:44px;display:inline-flex;align-items:center;justify-content:center;border:0;background:none;border-radius:10px;padding:0;cursor:pointer;flex-shrink:0}
.icon-btn:hover{background:rgba(27,36,64,.07)}
.icon-btn svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.btn{height:44px;padding:0 16px;border-radius:10px;border:1px solid var(--line);background:#fff;cursor:pointer;font-weight:500;display:inline-flex;align-items:center;gap:8px}
.btn.primary{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.btn.gold{background:var(--gold);border-color:var(--gold);color:var(--ink)}
.btn.small{height:36px;padding:0 12px;font-size:14px}
.muted{color:var(--muted)}

/* Library */
#library{min-height:100%;max-width:880px;margin:0 auto;padding:40px 24px 64px}
.brand{display:flex;align-items:center;gap:14px;margin-bottom:28px}
.brand h1{margin:0;font-family:Literata,Georgia,serif;font-size:36px;font-weight:600}
.brand p{margin:2px 0 0;color:var(--muted)}
.drop{border:2px dashed #CFC8BA;border-radius:16px;padding:36px 24px;text-align:center;background:#FBFAF6;display:flex;flex-direction:column;align-items:center;gap:12px}
.drop.over{border-color:var(--blue);background:#EEF3F9}
.drop h2{margin:0;font-size:18px}
#uploadStatus{min-height:22px;font-size:14px}
.books{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:16px;margin-top:28px}
.book{background:#fff;border:1px solid var(--line);border-radius:14px;padding:18px;display:flex;flex-direction:column;gap:10px}
.book h3{margin:0;font-family:Literata,Georgia,serif;font-size:19px;line-height:1.3;overflow-wrap:anywhere}
.bar{height:4px;border-radius:2px;background:#E6E1D6}.bar>div{height:4px;border-radius:2px;background:var(--gold)}
.book .row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.note{font-size:14px;color:var(--muted);margin-top:16px}

/* Reader */
#reader{height:100vh;height:100dvh;display:flex;flex-direction:column}
.topbar{height:60px;flex-shrink:0;padding:0 12px;display:flex;align-items:center;gap:8px;border-bottom:1px solid var(--line)}
.topbar .t{flex:1;min-width:0;display:flex;flex-direction:column}
.topbar .t b{font-size:15px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.topbar .t span{font-size:13px;color:var(--muted)}
.icon-btn.on{background:#DCE7F3;color:var(--blue)}
.spread{flex:1;display:flex;min-height:0}
.textpane{width:50%;overflow:auto;padding:40px 56px 56px}
.page-text{font-family:Literata,Georgia,serif;font-size:var(--fs);line-height:1.65;max-width:36em;margin:0 auto}
.page-text p{margin:0 0 1em}
.page-num{font-size:12px;letter-spacing:.12em;font-weight:600;color:var(--amber);margin:0 auto 18px;max-width:calc(var(--fs)*36);font-family:Inter,sans-serif}
.tok,.sp{border-radius:3px}
.tok.ent{color:var(--blue);font-weight:600;text-decoration:underline dotted 1.5px;text-underline-offset:4px;cursor:pointer}
.say-sent{background:#E4E9F2}
.tok.say-word{background:var(--ink)!important;color:var(--paper)!important;box-shadow:0 0 0 2px var(--ink)}
.tok.note-end::after{content:"";display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--amber);margin-left:3px;vertical-align:super}
.part-mark{display:inline-flex;align-items:center;justify-content:center;width:28px;height:28px;margin:0 6px 0 0;vertical-align:-6px;border:0;border-radius:7px;background:#EFE6D2;color:var(--amber);cursor:pointer;padding:0}
.part-mark svg{width:17px;height:17px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.part-mark.on{background:var(--gold);color:var(--ink)}
.empty-page{color:var(--muted);font-family:Inter,sans-serif;font-size:15px}
.imagepane{flex:1;position:relative;background:var(--ink);overflow:hidden;display:flex;align-items:center;justify-content:center}
#sceneImg,#sceneBg{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;opacity:0;transition:opacity .4s}
#sceneBg{object-fit:cover;filter:blur(28px) brightness(.5);transform:scale(1.15)}
#sceneImg.show,#sceneBg.show{opacity:1}
.imagepane.fill #sceneImg{object-fit:cover}
.imagepane.fill #sceneBg{display:none}
.scene-msg{position:relative;max-width:360px;text-align:center;color:#E9ECF4;padding:24px;display:flex;flex-direction:column;align-items:center;gap:14px;font-size:15px;line-height:1.5}
.scene-msg h3{margin:0;font-family:Literata,Georgia,serif;font-size:22px;font-weight:600;color:var(--paper)}
.pill{position:absolute;left:16px;bottom:16px;padding:7px 13px;border-radius:999px;background:rgba(11,14,31,.78);color:var(--paper);font-size:13px;display:flex;align-items:center;gap:8px}
.spin{width:14px;height:14px;border-radius:50%;border:2px solid rgba(246,243,236,.3);border-top-color:var(--paper);animation:sp 1s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.img-actions{position:absolute;right:12px;top:12px;display:flex;gap:6px}
.pic-ctl{position:absolute;left:12px;top:12px;display:flex;gap:6px;align-items:center;z-index:2;flex-wrap:wrap}
.pic-ctl .sw,.pic-ctl select{height:44px;border-radius:12px;border:0;background:rgba(11,14,31,.72);color:var(--paper);font:inherit;font-size:14px;font-weight:500}
.pic-ctl .sw{padding:0 12px 0 10px;display:inline-flex;align-items:center;gap:8px;cursor:pointer}
.pic-ctl .track{width:34px;height:20px;border-radius:999px;background:#5A6385;position:relative;flex-shrink:0}
.pic-ctl .track::after{content:"";position:absolute;top:2px;left:2px;width:16px;height:16px;border-radius:50%;background:var(--paper);transition:left .2s}
.pic-ctl .sw[aria-checked="true"] .track{background:var(--gold)}
.pic-ctl .sw[aria-checked="true"] .track::after{left:16px}
.pic-ctl select{padding:0 10px;cursor:pointer}
.pic-ctl select:disabled{opacity:.55;cursor:default}
.img-actions .icon-btn{background:rgba(11,14,31,.6);color:var(--paper)}
.player{height:84px;flex-shrink:0;padding:0 16px;display:flex;align-items:center;gap:12px;background:var(--ink);color:var(--paper)}
.player .icon-btn:hover{background:rgba(255,255,255,.08)}
.play{width:56px;height:56px;border-radius:50%;background:var(--gold);color:var(--ink);border:0;display:inline-flex;align-items:center;justify-content:center;cursor:pointer;flex-shrink:0}
.play svg{width:22px;height:22px;fill:currentColor}
.pmid{flex:1;min-width:0;display:flex;flex-direction:column;gap:6px}
.pmid .lbl{display:flex;justify-content:space-between;gap:8px;font-size:13px;color:#C9CEDD}
.pmid .lbl span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
input[type=range]{width:100%;accent-color:var(--gold);margin:0}
.player select{height:44px;border-radius:10px;border:1px solid #4A5373;background:var(--ink);color:var(--paper);padding:0 8px;font:inherit;font-size:14px}
@media (max-width:820px){
  .spread{flex-direction:column}
  .imagepane{flex:0 0 36vh;order:-1}
  .textpane{width:auto;flex:1;padding:20px 22px 40px}
  .player{gap:4px;padding:0 6px}
  .hide-narrow{display:none!important}
  .play{width:50px;height:50px}
}

/* Floating selection bar */
#selBar{position:fixed;z-index:40;display:flex;align-items:center;gap:2px;padding:0 6px;background:#fff;border-radius:12px;box-shadow:0 6px 24px rgba(27,36,64,.22);font-size:14px}
#selBar .dot{width:34px;height:44px;border:0;background:none;display:inline-flex;align-items:center;justify-content:center;cursor:pointer;padding:0}
#selBar .dot span{width:22px;height:22px;border-radius:50%;display:block}
#selBar .dot.cur span{box-shadow:0 0 0 2px #fff,0 0 0 4px var(--ink)}
#selBar .act{height:44px;border:0;background:none;padding:0 9px;font-weight:500;cursor:pointer;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
#selBar .act svg{width:17px;height:17px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
#selBar .div{width:1px;height:24px;background:var(--line);margin:0 4px}

/* Panels */
.scrim{position:fixed;inset:0;background:rgba(11,14,31,.35);z-index:50}
.panel{position:fixed;z-index:51;top:0;right:0;bottom:0;width:420px;max-width:100%;background:#fff;box-shadow:-12px 0 40px rgba(11,14,31,.2);display:flex;flex-direction:column}
.panel header{display:flex;align-items:center;gap:10px;padding:14px 14px 14px 22px;border-bottom:1px solid var(--line)}
.panel header h2{margin:0;flex:1;font-family:Literata,Georgia,serif;font-size:22px;font-weight:600}
.panel .body{flex:1;overflow:auto;padding:18px 22px 28px;display:flex;flex-direction:column;gap:18px}
@media (max-width:820px){.panel{top:auto;width:100%;max-height:82vh;border-radius:18px 18px 0 0}}
.shield{display:flex;gap:10px;align-items:flex-start;padding:12px 14px;border-radius:12px;background:#EAF0F7;color:#1F3F66;font-size:14px;line-height:1.45}
.shield svg{width:18px;height:18px;flex-shrink:0;margin-top:1px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.h3{margin:0;font-size:12px;font-weight:600;letter-spacing:.1em;color:var(--muted);text-transform:uppercase}
.desc{margin:0;font-family:Literata,Georgia,serif;font-size:16px;line-height:1.55}
.facts{display:flex;flex-direction:column;gap:4px}
.fact{display:flex;gap:10px;align-items:baseline;font-size:15px;line-height:1.45}
.fact button{flex-shrink:0;min-width:52px;height:32px;border:0;background:#F6EEDC;color:var(--amber);border-radius:8px;font-size:12px;font-weight:600;cursor:pointer}
.ent-list{display:flex;flex-direction:column;gap:2px}
.ent-item{display:flex;justify-content:space-between;align-items:center;gap:10px;min-height:44px;padding:0 12px;border:0;border-radius:10px;background:none;cursor:pointer;text-align:left;font-size:15px}
.ent-item:hover{background:#F3F1EA}
.ent-item small{color:var(--muted);font-size:13px}
.search{height:44px;border:1px solid var(--line);border-radius:10px;padding:0 12px;font:inherit;width:100%}
.hl-item{border:1px solid var(--line);border-radius:12px;padding:12px 14px;display:flex;flex-direction:column;gap:8px}
.hl-item q{font-family:Literata,Georgia,serif;font-size:15px;line-height:1.5;quotes:none;padding:1px 3px;border-radius:3px}
.hl-item .row{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.hl-item .n{font-size:14px;color:var(--ink);background:#FBF6EA;border-radius:8px;padding:8px 10px;white-space:pre-wrap}
.field{display:flex;flex-direction:column;gap:8px}
.field label{font-size:14px;font-weight:600}
.field select{height:44px;border:1px solid var(--line);border-radius:10px;padding:0 10px;font:inherit;background:#fff}
.seg{display:flex;gap:6px}
.switch{display:flex;align-items:center;gap:12px;font-size:15px}
.switch input{width:22px;height:22px;accent-color:var(--blue)}
.modal{position:fixed;z-index:60;left:50%;top:50%;transform:translate(-50%,-50%);width:min(440px,calc(100% - 32px));background:#fff;border-radius:16px;padding:20px;box-shadow:0 20px 60px rgba(11,14,31,.35);display:flex;flex-direction:column;gap:12px}
.modal textarea{width:100%;min-height:120px;border:1px solid var(--line);border-radius:10px;padding:10px;font:inherit;resize:vertical}
.modal .row{display:flex;justify-content:flex-end;gap:8px}
.toast{position:fixed;left:50%;bottom:100px;transform:translateX(-50%);background:var(--ink);color:var(--paper);padding:10px 16px;border-radius:10px;font-size:14px;z-index:70;max-width:calc(100% - 32px)}
</style>
<script src="pdf.min.js"></script>
<script src="jszip.min.js"></script>
</head>
<body>

<section id="library">
  <div class="brand">
    <svg width="56" height="56" viewBox="0 0 240 240" aria-hidden="true"><defs><clipPath id="rp"><path d="M124 78 Q162 64 204 74 L204 174 Q162 164 124 178 Z"/></clipPath></defs><rect width="240" height="240" rx="54" fill="#1B2440"/><path d="M36 74 Q78 64 116 78 L116 178 Q78 164 36 174 Z" fill="#F6F3EC"/><g stroke="#1B2440" stroke-width="5" stroke-linecap="round" opacity="0.45"><path d="M52 98 L100 104"/><path d="M52 116 L100 121"/><path d="M52 134 L100 138"/><path d="M52 152 L86 155"/></g><g clip-path="url(#rp)"><rect x="120" y="60" width="90" height="125" fill="#E8A33D"/><circle cx="172" cy="112" r="13" fill="#F6F3EC"/><path d="M120 168 L146 138 L164 156 L180 142 L210 172 L210 190 L120 190 Z" fill="#1B2440"/></g></svg>
    <div style="flex:1"><h1>Seequil</h1><p>Read it. See it. Remember it.</p></div>
    <button class="btn" id="libSet"><svg width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3h0a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8v0a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>Settings</button>
  </div>
  <div class="drop" id="drop">
    <h2>Add a book</h2>
    <div class="muted">Drop an EPUB or PDF here, or choose one. PDFs need real text (not scanned images).</div>
    <label class="btn primary" style="cursor:pointer">Choose a book<input id="fileIn" type="file" accept=".epub,.pdf,application/epub+zip,application/pdf" hidden></label>
    <div id="uploadStatus" role="status" aria-live="polite"></div>
  </div>
  <div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:16px"><button class="btn small" id="backupBtn">Back up library</button><label class="btn small" style="cursor:pointer">Restore a backup<input type="file" id="restoreIn" accept=".json,application/json" hidden></label></div>
  <div id="libMsg" class="note"></div>
  <div class="books" id="books"></div>
</section>

<section id="reader" hidden>
  <div class="topbar">
    <button class="icon-btn" id="toLib" aria-label="Back to library"><svg viewBox="0 0 24 24"><path d="M15 5 L8 12 L15 19"/></svg></button>
    <div class="t"><b id="bTitle"></b><span id="bPage"></span></div>
    <button class="icon-btn" id="memBtn" aria-label="Memory: people, places and events"><svg viewBox="0 0 24 24"><circle cx="6" cy="7" r="2.5"/><circle cx="18" cy="6" r="2.5"/><circle cx="12" cy="18" r="2.5"/><path d="M7.2 9.4 L10.8 15.8 M16.9 8.3 L13.2 15.8 M8.5 6.8 L15.5 6.2"/></svg></button>
    <button class="icon-btn" id="hlBtn" aria-label="Highlights and notes"><svg viewBox="0 0 24 24"><path d="M9 15 L4 20 H9 L11 18"/><path d="M14 4 L20 10 L11 19 L5 13 Z"/></svg></button>
    <button class="icon-btn" id="setBtn" aria-label="Settings" title="Settings"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3h0a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8v0a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg></button>
  </div>
  <div class="spread">
    <div class="textpane" id="textpane">
      <div class="page-num" id="pageNum"></div>
      <div class="page-text" id="pageText"></div>
    </div>
    <div class="imagepane" id="imagepane">
      <img id="sceneBg" alt="" aria-hidden="true">
      <img id="sceneImg" alt="">
      <div class="scene-msg" id="sceneMsg"></div>
      <div class="pill" id="scenePill" hidden></div>
      <div class="pic-ctl"><button class="sw" id="picSw" role="switch" aria-checked="true" aria-label="Make pictures"><span class="track" aria-hidden="true"></span><span id="picSwL">Pictures on</span></button><select id="picModeSel" aria-label="When to make pictures"><option value="tap">Only this page</option><option value="auto">Always</option></select></div>
      <div class="img-actions" id="imgActions"></div>
    </div>
  </div>
  <div class="player">
    <button class="icon-btn hide-narrow" id="prevPg" aria-label="Previous page"><svg viewBox="0 0 24 24"><path d="M15 5 L8 12 L15 19"/></svg></button>
    <button class="icon-btn" id="backS" aria-label="Previous sentence"><svg viewBox="0 0 24 24"><path d="M4 12a8 8 0 1 0 2.4-5.7"/><path d="M4 4v4h4"/></svg></button>
    <button class="play" id="playBtn" aria-label="Read aloud"><svg viewBox="0 0 24 24" id="playIco"><path d="M8 5v14l11-7z"/></svg></button>
    <button class="icon-btn" id="fwdS" aria-label="Next sentence"><svg viewBox="0 0 24 24"><path d="M20 12a8 8 0 1 1-2.4-5.7"/><path d="M20 4v4h-4"/></svg></button>
    <button class="icon-btn hide-narrow" id="nextPg" aria-label="Next page"><svg viewBox="0 0 24 24"><path d="M9 5 L16 12 L9 19"/></svg></button>
    <div class="pmid">
      <div class="lbl"><span id="ttsLbl">Tap play to read aloud</span><span id="memLbl"></span></div>
      <input type="range" id="pgSlider" min="1" max="1" value="1" aria-label="Page">
    </div>
    <select id="rateSel" aria-label="Reading speed"><option value="0.8">0.8×</option><option value="1" selected>1.0×</option><option value="1.2">1.2×</option><option value="1.5">1.5×</option><option value="2">2.0×</option></select>
  </div>
</section>

<input type="file" id="picIn" accept="image/*" hidden aria-hidden="true">
<div id="selBar" role="toolbar" aria-label="Highlight options" hidden></div>
<div id="overlay"></div>

<script>
(() => {
'use strict';
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const HL = {yellow:'#F6D58A', green:'#BFE3C9', pink:'#F5C2C7', blue:'#C9DAF5'};
const CHUNK = 6, GROUP = 20;
const ICON = {
  play:'<path d="M8 5v14l11-7z"/>',
  pause:'<rect x="6" y="5" width="4" height="14" rx="1"/><rect x="14" y="5" width="4" height="14" rx="1"/>',
  close:'<path d="M6 6l12 12M18 6L6 18"/>',
  lock:'<rect x="5" y="11" width="14" height="9" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/>',
  note:'<path d="M4 20h4L19 9l-4-4L4 16z"/>',

const LocalDB = (() => {
  let dbp = null;
  const open = () => dbp || (dbp = new Promise((res, rej) => { const r = indexedDB.open('seequil', 1); r.onupgradeneeded = () => r.result.createObjectStore('docs'); r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error); }));
  const req = r => new Promise((res, rej) => { r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error); });
  const store = async mode => (await open()).transaction('docs', mode).objectStore('docs');
  const snap = (id, data) => ({id, exists: data !== undefined, data: () => data, metadata: {fromCache: false, hasPendingWrites: false}});
  const plain = d => JSON.parse(JSON.stringify(d));
  function docRef(path){
    return {
      id: path.split('/').pop(), path,
      async get(){ return snap(this.id, await req((await store('readonly')).get(path))); },
      async set(data){ await req((await store('readwrite')).put(plain(data), path)); },
      async update(data){ const s = await store('readwrite'); const cur = await req(s.get(path)); if (cur === undefined) throw {code: 'invalid_argument'}; await req(s.put({...cur, ...plain(data)}, path)); },
      async delete(){ await req((await store('readwrite')).delete(path)); },
      collection(sub){ return colRef(path + '/' + sub); }
    };
  }
  function colRef(path, filters = []){
    return {
      path,
      doc(id){ return docRef(path + '/' + (id || ('d' + Date.now().toString(36) + Math.random().toString(36).slice(2, 7)))); },
      where(f, op, v){ return colRef(path, [...filters, [f, op, v]]); },
      async get(){

        const docs = [];
        keys.forEach((k, i) => { const rest = k.slice(path.length + 1); if (rest.includes('/')) return; const v = vals[i]; if (filters.every(([f, op, val]) => op !== '==' || (v && v[f] === val))) docs.push(snap(rest, v)); });
        return {docs, size: docs.length, empty: !docs.length};
      }
    };
  }
  return {
    doc: docRef, collection: p => colRef(p),
    async dump(){ const s = await store('readonly'); const [keys, vals] = await Promise.all([req(s.getAllKeys()), req(s.getAll())]); return keys.map((k, i) => [k, vals[i]]); },

  };
})();

/* EPUB: unzip, follow the reading order (spine), pull out paragraphs, cut into pages */
function hashBytes(u8){ let h1 = 0x811c9dc5, h2 = 0x01000193 ^ u8.length; for (let i = 0; i < u8.length; i++){ h1 = Math.imul(h1 ^ u8[i], 16777619); if ((i & 7) === 0) h2 = Math.imul(h2 ^ u8[i], 2246822519); } return 'ep' + (h1 >>> 0).toString(36) + (h2 >>> 0).toString(36) + u8.length.toString(36); }

const xmlOf = s => new DOMParser().parseFromString(s, 'application/xml');
const byTag = (root, tag) => [...root.getElementsByTagNameNS('*', tag)];
async function readEpub(file, st){
  if (!window.JSZip){ st.textContent = 'The EPUB reader didn’t load. Reload the page and try again.'; return null; }
  const u8 = new Uint8Array(await file.arrayBuffer());
  const zip = await JSZip.loadAsync(u8);
  const enc = zip.file('META-INF/encryption.xml');
  if (enc){
    const algs = byTag(xmlOf(await enc.async('string')), 'EncryptionMethod').map(m => m.getAttribute('Algorithm') || '');
    if (algs.some(a => !/obfuscation|embedding|font/i.test(a))){ st.textContent = 'This EPUB is copy-protected (DRM), so Seequil can’t open it. Books from stores like Kindle or Apple Books usually are.'; return null; }
  }
  const cont = zip.file('META-INF/container.xml');
  if (!cont) throw {userMsg: 'That doesn’t look like a valid EPUB file.'};
  const rf = byTag(xmlOf(await cont.async('string')), 'rootfile')[0];
  const opfPath = rf && rf.getAttribute('full-path');
  if (!opfPath || !zip.file(opfPath)) throw {userMsg: 'That doesn’t look like a valid EPUB file.'};
  const base = opfPath.includes('/') ? opfPath.slice(0, opfPath.lastIndexOf('/') + 1) : '';
  const opf = xmlOf(await zip.file(opfPath).async('string'));
  const tEl = byTag(opf, 'title')[0];
  const title = (tEl && tEl.textContent.trim()) || file.name.replace(/\.epub$/i, '');
  const manifest = new Map(byTag(opf, 'item').map(it => [it.getAttribute('id'), it.getAttribute('href')]));
  const spine = byTag(opf, 'itemref').filter(r => r.getAttribute('linear') !== 'no').map(r => manifest.get(r.getAttribute('idref'))).filter(Boolean);
  const pages = []; let chars = 0;
  for (let i = 0; i < spine.length; i++){
    st.textContent = `Reading section ${i + 1} of ${spine.length}…`;
    const path = joinPath(base, decodeURIComponent(spine[i].split('#')[0]));
    const f = zip.file(path); if (!f) continue;
    const src = await f.async('string');
    let doc = new DOMParser().parseFromString(src, 'application/xhtml+xml');
    if (doc.querySelector('parsererror')) doc = new DOMParser().parseFromString(src, 'text/html');
    const paras = epubBlocks(doc.body || doc.documentElement);
    if (!paras.length) continue;
    chars += paras.join('').length;
    pages.push(...paginate(paras));
  }
  if (chars < 200){ st.textContent = 'Couldn’t find any text in this EPUB.'; return null; }
  return {id: hashBytes(u8), title, pages};
}
function epubBlocks(root){
  if (!root) return [];
  root.querySelectorAll('script,style,nav,aside[epub\\:type="footnote"]').forEach(n => n.remove());
  const SEL = 'p,h1,h2,h3,h4,h5,h6,li,blockquote,pre,dt,dd,figcaption,td';
  const clean = s => s.replace(/\s+/g, ' ').trim();
  let els = [...root.querySelectorAll(SEL)].filter(e => !e.querySelector(SEL));
  let out = els.map(e => clean(e.textContent)).filter(Boolean);
  const total = clean(root.textContent).length;
  if (out.join('').length < total * 0.5){
    const divs = [...root.querySelectorAll('div')].filter(d => !d.querySelector('div,' + SEL));
    const more = divs.map(d => clean(d.textContent)).filter(Boolean);
    if (more.join('').length > out.join('').length) out = more;
    if (out.join('').length < total * 0.5) out = root.textContent.split(/\n\s*\n/).map(clean).filter(Boolean);
  }

}
function paginate(paras){

  const pieces = [];
  for (const p of paras){
    if (p.length <= MAX){ pieces.push(p); continue; }
    let buf = '';
    for (const s of splitSentences(p).map(x => p.slice(x.s, x.e))){
      if (buf && (buf + s).length > TARGET){ pieces.push(buf.trim()); buf = ''; }
      buf += s;
    }
    if (buf.trim()) pieces.push(buf.trim());
  }
  const pages = []; let cur = [], len = 0;
  for (const p of pieces){
    if (cur.length && len + p.length > TARGET){ pages.push(cur); cur = []; len = 0; }
    cur.push(p); len += p.length;
  }
  if (cur.length) pages.push(cur);
  return pages;
}

async function extractPage(pdf, i){
  const page = await pdf.getPage(i);
  const tc = await page.getTextContent();
  const lines = []; let cur = null;
  for (const it of tc.items){
    if (typeof it.str !== 'string') continue;
    const y = it.transform[5], h = Math.abs(it.transform[3]) || it.height || 10;
    if (!cur || Math.abs(y - cur.y) > h * 0.6){ if (cur) lines.push(cur); cur = {y, h, text: ''}; }
    if (cur.text && it.str && !/\s$/.test(cur.text) && !/^\s/.test(it.str) && it.transform[4] > (cur.lastX || 0) + h * 0.15) cur.text += ' ';
    cur.text += it.str; cur.lastX = it.transform[4] + (it.width || 0);
    if (it.hasEOL){ lines.push(cur); cur = null; }
  }
  if (cur) lines.push(cur);
  const L = lines.map(l => ({...l, text: l.text.replace(/\s+/g,' ').trim()})).filter(l => l.text && !/^\d{1,4}$/.test(l.text));
  if (!L.length) return [];
  const gaps = []; for (let k = 1; k < L.length; k++){ const g = L[k-1].y - L[k].y; if (g > 0) gaps.push(g); }
  gaps.sort((a,b)=>a-b); const med = gaps.length ? gaps[Math.floor(gaps.length/2)] : 14;
  const maxLen = Math.max(...L.map(l => l.text.length));
  const paras = []; let buf = L[0].text;
  for (let k = 1; k < L.length; k++){
    const prev = L[k-1], ln = L[k], gap = prev.y - ln.y;
    const shortEnd = prev.text.length < maxLen * 0.72 && /[.!?:"”’)]$/.test(prev.text);
    if (gap > med * 1.4 || gap < -2 || shortEnd){ paras.push(buf); buf = ln.text; continue; }
    if (/[A-Za-z]-$/.test(buf) && /^[a-z]/.test(ln.text)) buf = buf.slice(0,-1) + ln.text; else buf += ' ' + ln.text;
  }
  paras.push(buf);
  return paras.map(p => p.trim()).filter(Boolean);
}

/* ---------- text rendering ---------- */
let pageSents = [];
function splitSentences(text){
  const out = []; const re = /[^.!?…]*[.!?…]+["'”’)\]]*\s*|[^.!?…]+$/g; let m;
  while ((m = re.exec(text))){ if (!m[0]){ re.lastIndex++; continue; } out.push({s: m.index, e: m.index + m[0].length}); }
  return out.length ? out : [{s:0, e:text.length}];
}
function visibleEntities(){ return book.entities.filter(en => en.firstPage <= P); }
function entityMatcher(ents){
  const map = new Map();
  for (const en of ents){
    for (const n of [en.name, ...en.aliases]){
      if (!n || n.length < 3 || !/^\p{Lu}/u.test(n) || /^(The|A|An|He|She|It|They|His|Her)$/.test(n)) continue;
      if (!map.has(n)) map.set(n, en.id);
    }
  }
  if (!map.size) return null;
  const names = [...map.keys()].sort((a,b)=>b.length-a.length).map(n => n.replace(/[.*+?^${}()|[\]\\]/g,'\\$&'));
  return {map, rx: new RegExp('(?<![\\p{L}\\p{N}])(?:' + names.join('|') + ')(?![\\p{L}\\p{N}])', 'gu')};
}
function renderText(){
  const wrap = $('#pageText'); wrap.textContent = '';
  pageSents = []; pageQuotes = settings.castOn ? quotesWithSpeakers(P) : [];
  const paras = book.pages[P-1] || [];
  if (!paras.length){ wrap.innerHTML = '<p class="empty-page">No text on this page.</p>'; return; }
  const em = entityMatcher(visibleEntities());
  const hls = book.hl.filter(h => h.page === P);
  paras.forEach((text, pi) => {
    const p = document.createElement('p');
    const pq = settings.castOn ? pageQuotes.filter(q => q.p === pi) : [];
    const sents = splitPieces(text, pq), base = pageSents.length;
    sents.forEach(s => pageSents.push({p: pi, s: s.s, e: s.e, text: text.slice(s.s, s.e).trim(), speaker: s.speaker || null}));
    const ents = [];
    if (em){ em.rx.lastIndex = 0; let m; while ((m = em.rx.exec(text))) ents.push({s: m.index, e: m.index + m[0].length, id: em.map.get(m[0])}); }
    const ph = hls.filter(h => h.para === pi);
    const pp = (book.parts || []).filter(x => x.page === P && pi >= x.ps && pi <= x.pe); const placed = new Set();
    const re = /\S+|\s+/g; let m;
    while ((m = re.exec(text))){
      const s = m.index, e = s + m[0].length, sp = /^\s/.test(m[0]);
      const span = document.createElement('span');
      span.className = sp ? 'sp' : 'tok'; span.textContent = m[0];
      span.dataset.p = pi; span.dataset.s = s; span.dataset.e = e;
      const si = sents.findIndex(x => s >= x.s && s < x.e); span.dataset.sent = base + Math.max(0, si);
      const h = ph.find(h => sp ? (s >= h.s && e <= h.e) : (s < h.e && e > h.s));
      if (h){ span.style.background = HL[h.color] || HL.yellow; span.dataset.hl = h.id; if (!sp && h.note && e >= h.e) span.classList.add('note-end'); }
      if (!sp){ const en = ents.find(r => s >= r.s && s < r.e); if (en){ span.classList.add('ent'); span.dataset.ent = en.id; span.tabIndex = 0; span.setAttribute('role','button'); } }
      const part = pp.find(x => (pi > x.ps || s >= x.s) && (pi < x.pe || s < x.e));
      if (part){
        span.dataset.part = part.id;
        if (!sp && pi === part.ps && !placed.has(part.id)){
          placed.add(part.id);
          const mk = document.createElement('button'); mk.className = 'part-mark' + (activePart === part.id ? ' on' : ''); mk.dataset.mark = part.id;
          mk.setAttribute('aria-label', 'Show the picture for this passage'); mk.innerHTML = svgI('image'); p.appendChild(mk);
        }
      }
      p.appendChild(span);
    }
    wrap.appendChild(p);
  });
}

/* ---------- selection & highlights ---------- */
let selCtx = null;
function tokFrom(node, offset){
  let el = node.nodeType === 3 ? node.parentElement : node;
  if (el && el.tagName === 'P') el = el.childNodes[Math.min(offset, el.childNodes.length - 1)];
  if (el && el.nodeType === 3) el = el.parentElement;
  return el && el.dataset && el.dataset.s !== undefined ? el : null;
}
function rangesFromSelection(){
  const sel = window.getSelection();
  if (!sel || sel.isCollapsed || !sel.rangeCount) return null;
  const r = sel.getRangeAt(0);
  if (!tp.contains(r.commonAncestorContainer)) return null;
  const a = tokFrom(r.startContainer, r.startOffset), b = tokFrom(r.endContainer, Math.max(0, r.endOffset - 1));
  if (!a || !b) return null;
  const pa = +a.dataset.p, pb = +b.dataset.p;
  let sa = a.classList.contains('sp') ? +a.dataset.e : +a.dataset.s;
  let eb = b.classList.contains('sp') ? +b.dataset.s : +b.dataset.e;
  const paras = book.pages[P-1]; const out = [];
  for (let pi = pa; pi <= pb; pi++){
    const text = paras[pi]; let s = pi === pa ? sa : 0, e = pi === pb ? eb : text.length;
    while (s < e && /\s/.test(text[s])) s++; while (e > s && /\s/.test(text[e-1])) e--;
    if (e > s) out.push({para: pi, s, e, text: text.slice(s, e)});
  }
  return out.length ? {ranges: out, rect: r.getBoundingClientRect()} : null;
}
document.addEventListener('selectionchange', debounce(() => {

  const got = rangesFromSelection();
  if (got) showSelBar({mode:'new', ranges: got.ranges}, got.rect);
  else if (selCtx && selCtx.mode === 'new') hideSel();
}, 250));
function quoteAt(ctx){ if (!settings.castOn || !ctx || ctx.mode !== 'new') return null; const r = ctx.ranges[0]; return pageQuotes.find(q => q.p === r.para && r.s >= q.s && r.s < q.e) || null; }
function showSelBar(ctx, rect){
  selCtx = ctx;
  const bar = $('#selBar');
  const cur = ctx.mode === 'edit' ? ctx.hl.color : null;
  bar.innerHTML = Object.entries(HL).map(([k,v]) => `<button class="dot${cur===k?' cur':''}" data-c="${k}" aria-label="${k} highlight"><span style="background:${v}"></span></button>`).join('') +
    `<span class="div"></span><button class="act" data-a="note">${svgI('note')}Note</button><button class="act" data-a="copy">${svgI('copy')}Copy</button>` +
    (ctx.mode === 'new' ? `<button class="act" data-a="read">${svgI('speak')}Read from here</button><button class="act" data-a="part">${svgI('image')}Picture this</button>${quoteAt(ctx) ? `<button class="act" data-a="who">${svgI('speak')}Speaker: ${esc(quoteAt(ctx).speaker && !CAST_SKIP.test(quoteAt(ctx).speaker) ? quoteAt(ctx).speaker : 'set')}</button>` : ''}` : `<button class="act" data-a="del">${svgI('trash')}Remove</button>`);
  bar.hidden = false;
  const bw = bar.offsetWidth, bh = bar.offsetHeight;
  const coarse = matchMedia('(pointer:coarse)').matches;

  bar.style.top = top + 'px';
  bar.style.left = Math.max(8, Math.min(innerWidth - bw - 8, rect.left + rect.width/2 - bw/2)) + 'px';
}
function hideSel(){ $('#selBar').hidden = true; selCtx = null; }
$('#selBar').addEventListener('mousedown', e => e.preventDefault());
$('#selBar').addEventListener('click', async e => {
  const b = e.target.closest('button'); if (!b || !selCtx) return;

function dataUrlToBlob(d){
  const [head, b64] = d.split(','); const mime = (head.match(/data:([^;]+)/) || [])[1] || 'image/jpeg';
  const bin = atob(b64); const u8 = new Uint8Array(bin.length); for (let i = 0; i < bin.length; i++) u8[i] = bin.charCodeAt(i);
  return new Blob([u8], {type: mime});
}
async function shrinkImage(file){
  const url = URL.createObjectURL(file);
  try {
    const img = await new Promise((res, rej) => { const i = new Image(); i.onload = () => res(i); i.onerror = rej; i.src = url; });
    const w = img.naturalWidth, h = img.naturalHeight; let sc = Math.min(1, 1100 / Math.max(w, h));
    for (let k = 0; k < 7; k++){
      const c = document.createElement('canvas'); c.width = Math.max(1, Math.round(w * sc)); c.height = Math.max(1, Math.round(h * sc));
      const ctx = c.getContext('2d'); ctx.fillStyle = '#1B2440'; ctx.fillRect(0, 0, c.width, c.height); ctx.drawImage(img, 0, 0, c.width, c.height);
      const d = c.toDataURL('image/jpeg', Math.max(0.5, 0.86 - k * 0.06));
      if (d.length < 230000) return d;
      sc *= 0.85;
    }
    throw new Error('too big');
  } finally { URL.revokeObjectURL(url); }
}
async function usePicture(file, t){
  if (!file.type.startsWith('image/')){ toast('That isn’t an image file'); return; }
  let d; try { d = await shrinkImage(file); } catch(e){ toast('Couldn’t read that picture'); return; }
  if (t.kind === 'part'){
    const part = book.parts.find(x => x.id === t.part.id); if (!part) return;
    part.img = d; delete part.svg; setPartArt(part.id, null, d);
    if (db) try { await bref().collection('parts').doc(part.id).set({...part}); } catch(e){ toast('Couldn’t save the picture'); }
    toast('Picture added to this passage');
  } else {
    setArt(t.page, null, d);
    if (db) try { await bref().collection('art').doc(String(t.page)).set({page: t.page, img: d}); } catch(e){ toast('Couldn’t save the picture'); }
    toast('Picture added to page ' + t.page);
  }
  renderScene();
}

const fileTitle = () => (book.title || 'book').replace(/[\\/:*?"<>|]+/g, '').slice(0, 60).trim() || 'book';
function svgToPng(svg){
  return new Promise((res, rej) => {
    const url = URL.createObjectURL(new Blob([svg], {type:'image/svg+xml'}));
    const img = new Image();
    img.onload = () => {
      try {
        const c = document.createElement('canvas'); c.width = 1200; c.height = 1400;
        c.getContext('2d').drawImage(img, 0, 0, 1200, 1400);
        c.toBlob(b => { URL.revokeObjectURL(url); b ? res(b) : rej(new Error('png')); }, 'image/png');
      } catch(e){ URL.revokeObjectURL(url); rej(e); }
    };
    img.onerror = () => { URL.revokeObjectURL(url); rej(new Error('load')); };
    img.src = url;
  });
}
async function offerFile(filename, data){
  try { await downloads.save({filename, data}); }
  catch(e){ if (e && e.code !== 'declined') toast('Couldn’t save the file here'); }
}
async function savePicture(){
  if (!downloads || !shown || !(shown.svg || shown.img)) return;
  let data, name = `${fileTitle()} - ${shown.name}`;
  if (shown.img){ await offerFile(name + '.jpg', dataUrlToBlob(shown.img)); return; }
  try { data = await svgToPng(shown.svg); name += '.png'; } catch(e){ data = shown.svg; name += '.svg'; }
  await offerFile(name, data);
}
async function saveAllPictures(btn){
  if (!downloads || !window.JSZip) return;
  btn.disabled = true; const label = btn.textContent;
  try {
    const items = [];
    if (db){
      btn.textContent = 'Gathering pictures…';
      const s = await withTimeout(bref().collection('art').get(), 20000);
      s.docs.forEach(d => { const x = d.data(); const nm = `page-${String(x.page).padStart(4,'0')}`; if (x.img) items.push({name: nm + '.jpg', img: x.img}); else if (x.svg && x.svg !== 'NONE') items.push({name: nm + '.png', svg: x.svg}); });
    } else {
      artCache.forEach((a, pg) => { const nm = `page-${String(pg).padStart(4,'0')}`; if (a.img) items.push({name: nm + '.jpg', img: a.img}); else if (a.svg) items.push({name: nm + '.png', svg: a.svg}); });
    }
    book.parts.forEach(p => { const nm = `passage-page-${String(p.page).padStart(4,'0')}-${p.id}`; if (p.img) items.push({name: nm + '.jpg', img: p.img}); else if (p.svg) items.push({name: nm + '.png', svg: p.svg}); });
    if (!items.length){ toast('No pictures yet for this book'); return; }
    const zip = new JSZip(); let n = 0;
    for (const it of items){
      btn.textContent = `Preparing ${++n} of ${items.length}…`;
      if (it.img){ zip.file(it.name, dataUrlToBlob(it.img)); continue; }
      try { zip.file(it.name, await svgToPng(it.svg)); } catch(e){ zip.file(it.name.replace(/\.png$/, '.svg'), it.svg); }
    }
    btn.textContent = 'Zipping…';
    await offerFile(`${fileTitle()} - pictures.zip`, await zip.generateAsync({type:'blob'}));
  } catch(e){ toast('Couldn’t gather the pictures. Try again.'); }
  finally { btn.disabled = false; btn.textContent = label; }
}

function settled(pg){ const a = artCache.get(pg); return !!a && !(a.status === 'idle' && settings.picMode === 'auto'); }
function requestArt(page, front, now, force, draw){
  if (!book || page < 1 || page > book.numPages) return;
  if (settled(page) && !force && !draw) { if (front) renderScene(); return; }
  if (artQueue.some(q => q.page === page)) return;
  const job = {page, force, draw, bid: book.id};
  front ? artQueue.unshift(job) : artQueue.push(job);
  runArt();
}
async function runArt(){
  if (artBusy) return; artBusy = true;
  try {
    while (artQueue.length){
      const job = artQueue.shift();
      if (!book || job.bid !== book.id) continue;
      if (settled(job.page) && !job.force && !job.draw) continue;
      if (Math.abs(job.page - P) > 2) continue;
      await loadArt(job);
      if (book && job.bid === book.id){
        if (job.page === P) renderScene();
        if (job.page === P && picReady()) requestArt(P + 1, false);
      }
    }
  } finally { artBusy = false; }
}
async function loadArt(job){
  const page = job.page;
  if (db && !job.force){
    try { const s = await withTimeout(bref().collection('art').doc(String(page)).get()); if (s.exists){ const d = s.data(); setArt(page, d.svg, d.img); return; } } catch(e){}
  }
  if (settings.picGen === false || (settings.picMode !== 'auto' && !job.draw && !job.force)){ artCache.set(page, {status:'idle'}); return; }
  if (!picReady() || Date.now() < backoffUntil) return;
  const text = (book.pages[page-1] || []).join('\n\n');
  if (text.length < 150){ artCache.set(page, {status:'none'}); return; }
  if (settings.picSource === 'openai'){
    try {
      const d = await openaiPicture({kind:'page', page, key:'p' + page, text, label:'page ' + page}, true);
      if (d === 'NONE'){ artCache.set(page, {status:'none'}); try { await bref().collection('art').doc(String(page)).set({page, svg:'NONE'}); } catch(e){} return; }
      setArt(page, null, d);
      try { await bref().collection('art').doc(String(page)).set({page, img: d}); } catch(e){}
    } catch(e){ aiError(e); if (!aiBlocked && !budgetHit()) artCache.set(page, {status:'error', msg: e && e.message}); }
    return;
  }
  const known = knownFor(text, page);
  const prompt = `You are the illustrator for an illustrated e-reader. Draw ONE illustration for this page of the book "${book.title}", showing the most important moment or setting on the page.
${ART_RULES}
- If the page has no scene (title page, copyright, contents, acknowledgments, index), reply with exactly NONE.
${known ? 'Characters and places on this page, for a consistent look:\n' + known + '\n' : ''}
PAGE ${page}:
"""
${text.slice(0, 6000)}
"""`;
  try {
    const r = await callText(prompt, {modelTier: 'default', provider: 'anthropic', maxTokens: 12000});
    const svg = cleanSvg(r && r.text);
    if (svg === 'NONE'){ artCache.set(page, {status:'none'}); if (db) try { await bref().collection('art').doc(String(page)).set({page, svg:'NONE'}); } catch(e){} return; }
    if (!svg){ artCache.set(page, {status:'error'}); return; }
    setArt(page, svg);
    if (db && svg.length < 200000) try { await bref().collection('art').doc(String(page)).set({page, svg}); } catch(e){}
  } catch(e){ aiError(e); if (!aiBlocked) artCache.set(page, {status:'error'}); }
}
function setArt(page, svg, img){
  const old = artCache.get(page); if (old && old.url) URL.revokeObjectURL(old.url);
  if (img){ artCache.set(page, {status:'ready', url: img, img}); return; }
  if (!svg || svg === 'NONE'){ artCache.set(page, {status:'none'}); return; }
  const url = URL.createObjectURL(new Blob([svg], {type:'image/svg+xml'}));
  artCache.set(page, {status:'ready', url, svg});
}
function cleanSvg(raw){
  let t = String(raw || '').trim();
  if (/^NONE\b/i.test(t)) return 'NONE';
  const a = t.indexOf('<svg'), b = t.lastIndexOf('</svg>');
  if (a < 0 || b < 0) return null;
  t = t.slice(a, b + 6);
  const doc = new DOMParser().parseFromString(t, 'image/svg+xml');
  if (doc.querySelector('parsererror')) return null;
  const svg = doc.documentElement;
  svg.querySelectorAll('script,foreignObject,image,iframe').forEach(n => n.remove());
  svg.querySelectorAll('*').forEach(n => { for (const at of [...n.attributes]){ if (/^on/i.test(at.name)) n.removeAttribute(at.name); else if (/href$/i.test(at.name) && !at.value.trim().startsWith('#')) n.removeAttribute(at.name); } });
  if (!svg.getAttribute('viewBox')) svg.setAttribute('viewBox', '0 0 600 700');
  svg.removeAttribute('width'); svg.removeAttribute('height');
  svg.setAttribute('preserveAspectRatio', 'xMidYMid slice');
  let out = new XMLSerializer().serializeToString(svg);
  if (!/xmlns="http:\/\/www\.w3\.org\/2000\/svg"/.test(out)) out = out.replace('<svg', '<svg xmlns="http://www.w3.org/2000/svg"');
  return out;
}

/* ---------- memory (codex) ---------- */
let codexBusy = false;
function slug(s){ return 'e_' + String(s).toLowerCase().replace(/[^a-z0-9]+/g,'-').slice(0,40); }
function rebuildEntities(){
  const list = [], byKey = new Map();
  const chunks = [...book.codex.values()].sort((a,b) => a.idx - b.idx);
  for (const c of chunks){
    const from = c.idx * CHUNK + 1, to = Math.min(book.numPages, from + CHUNK - 1);
    for (const x of (c.entities || [])){
      if (!x || !x.name) continue;
      const keys = [x.name, ...(x.aliases || [])].filter(Boolean).map(k => String(k).toLowerCase());
      let en = keys.map(k => byKey.get(k)).find(Boolean);
      if (!en){ en = {id: slug(x.name), name: String(x.name), type: x.type || 'thing', aliases: new Set(), description: '', descPage: Infinity, facts: [], firstPage: Infinity}; list.push(en); }
      (x.aliases || []).forEach(a => { if (a && a !== en.name) en.aliases.add(String(a)); });
      keys.forEach(k => { if (!byKey.has(k)) byKey.set(k, en); });
      for (const f of (x.facts || [])){
        let pg = Math.round(Number(f.page)); if (!f.text) continue;
        if (!(pg >= from && pg <= to)) pg = to;
        en.facts.push({page: pg, text: String(f.text)}); en.firstPage = Math.min(en.firstPage, pg);
      }
      if (x.description && !en.description){
        let dp = Math.round(Number(x.firstPage)); if (!(dp >= from && dp <= to)) dp = en.firstPage !== Infinity ? Math.max(en.firstPage, from) : to;
        en.description = String(x.description); en.descPage = dp;
        if (en.firstPage === Infinity) en.firstPage = dp;
      }
    }
  }
  list.forEach(en => en.facts.sort((a,b) => a.page - b.page));
  book.entities = list.filter(en => en.firstPage !== Infinity);
}
function setMemLbl(t){ $('#memLbl').textContent = t || ''; }
async function ensureCodex(){
  if (!book || !aiReady() || codexBusy || Date.now() < backoffUntil) return;
  const last = Math.floor((book.numPages - 1) / CHUNK);
  const target = Math.min(last, Math.floor((P - 1) / CHUNK) + 1);
  const bid = book.id;
  codexBusy = true;
  try {
    for (let idx = 0; idx <= target; idx++){
      if (!book || book.id !== bid || !aiReady()) break;
      if (book.codex.has(idx)) continue;
      const from = idx * CHUNK + 1, to = Math.min(book.numPages, from + CHUNK - 1);
      if (from <= P) setMemLbl(`Memory catching up · p. ${from}–${to}`);
      const ok = await buildChunk(idx, from, to);
      if (!ok) break;
      rebuildEntities();
      if (from <= P) renderText();
    }
  } finally { codexBusy = false; setMemLbl(''); }
}
async function buildChunk(idx, from, to){
  let pagesTxt = '';
  for (let p = from; p <= to; p++){ const t = (book.pages[p-1] || []).join('\n'); if (t.trim()) pagesTxt += `\n[Page ${p}]\n${t}\n`; }
  let entities = [];
  if (pagesTxt.trim().length > 80){
    const known = book.entities.slice(0, 200).map(en => `${en.name} (${en.type})${en.aliases.size ? ' — also: ' + [...en.aliases].join(', ') : ''}`).join('\n') || '(none yet)';
    const prompt = `You are building a spoiler-free reader's companion for the book "${book.title}". Read ONLY the pages below and record the named characters, places, events, groups and important named things that appear in them.
Rules:
- Use only what these pages say. Never use outside knowledge of this book, even if you recognize it: the reader has not read further.
- facts: short sentences about what happens to, or is revealed about, the entity on that page. Give the page number each fact comes from.
- If an entity in KNOWN ENTITIES appears again, use its exact known name (match nicknames, surnames and titles to it).
- aliases: other proper names the text uses for it on these pages, exactly as written (for example a first name alone).
- For an entity NOT in KNOWN ENTITIES: "firstPage" = the page where it first appears, and "description" = one sentence on who or what it is, using ONLY what that first page says.
- type is one of: character, place, event, group, thing.
- Skip the author, publisher and front matter. Skip entities with nothing meaningful here.
Reply with JSON only, no fences:
{"entities":[{"name":"","type":"","aliases":[],"firstPage":0,"description":"","facts":[{"page":0,"text":""}]}]}

KNOWN ENTITIES:
${known}

PAGES:
${pagesTxt.slice(0, 24000)}`;
    try {
      const r = await sample(prompt, {modelTier: 'default'});
      const t = (r && r.text) || '';
      const a = t.indexOf('{'), b = t.lastIndexOf('}');
      const parsed = JSON.parse(t.slice(a, b + 1));
      entities = Array.isArray(parsed.entities) ? parsed.entities.slice(0, 80).map(x => ({
        name: String(x.name || '').slice(0, 80), type: ['character','place','event','group','thing'].includes(x.type) ? x.type : 'thing',
        aliases: Array.isArray(x.aliases) ? x.aliases.slice(0, 6).map(s => String(s).slice(0, 60)) : [],
        firstPage: Number(x.firstPage) || 0, description: String(x.description || '').slice(0, 400),
        facts: Array.isArray(x.facts) ? x.facts.slice(0, 12).map(f => ({page: Number(f.page) || 0, text: String(f.text || '').slice(0, 300)})) : []
      })).filter(x => x.name) : [];
    } catch(e){
      if (e && e.code){ aiError(e); return false; }
      return false; // unreadable answer: try again on the next page turn
    }
  }
  const doc = {idx, from, to, entities};
  book.codex.set(idx, doc);
  if (db) try { await bref().collection('codex').doc('c' + idx).set(doc); } catch(e){}
  return true;
}

/* ---------- full cast: a voice for each character ---------- */
const castCache = new Map(); const castBusy = new Set();
let pageQuotes = [];
const CAST_SKIP = /^(narrator|unknown|none)$/i;
function findQuotes(paras){
  const out = [];
  paras.forEach((t, pi) => { const rx = /[“"]([^”"]{1,900})[”"]/g; let m; while ((m = rx.exec(t))){ if (m[1].trim().length < 2) continue; out.push({p: pi, s: m.index, e: m.index + m[0].length, text: m[0]}); } });
  return out;
}
function resolveName(n){
  const k = String(n || '').trim().toLowerCase(); if (!k) return '';
  const en = book.entities.find(x => x.name.toLowerCase() === k || [...x.aliases].some(a => a.toLowerCase() === k));
  return en ? en.name : String(n).trim();
}
function quotesWithSpeakers(page){
  const qs = findQuotes(book.pages[page - 1] || []);
  const doc = castCache.get(page); if (!doc) return qs.map(q => ({...q, speaker: null}));
  return qs.map(q => ({...q, speaker: (doc.map || {})[q.p + ':' + q.s] || null}));
}
function splitPieces(text, quotes){
  const base = splitSentences(text); if (!quotes.length) return base;
  const cuts = new Set([0, text.length]); base.forEach(r => { cuts.add(r.s); cuts.add(r.e); }); quotes.forEach(q => { cuts.add(q.s); cuts.add(q.e); });
  const pts = [...cuts].sort((a, b) => a - b); const out = [];
  for (let i = 0; i < pts.length - 1; i++){ if (pts[i + 1] > pts[i]){ const q = quotes.find(q => pts[i] >= q.s && pts[i + 1] <= q.e); out.push({s: pts[i], e: pts[i + 1], speaker: q && q.speaker && !CAST_SKIP.test(q.speaker) ? q.speaker : null}); } }
  return out;
}
async function ensureCast(page){
  if (!book || !settings.castOn || page < 1 || page > book.numPages || castCache.has(page) || castBusy.has(page)) return;
  const bid = book.id; castBusy.add(page);
  try {
    let doc = null;
    if (db){ try { const s = await bref().collection('cast').doc('p' + page).get(); if (s.exists) doc = s.data(); } catch(e){} }
    if (!doc){
      const paras = book.pages[page - 1] || []; const qs = findQuotes(paras);
      if (!qs.length) doc = {page, map: {}};
      else {
        if (!textReady() || Date.now() < backoffUntil) return;
        let marked = '';
        paras.forEach((t, pi) => { let out = '', last = 0; qs.forEach((q, i) => { if (q.p !== pi) return; out += t.slice(last, q.s) + `[Q${i + 1}]` + t.slice(q.s, q.e); last = q.e; }); marked += out + t.slice(last) + '\n\n'; });
        const known = book.entities.filter(en => en.type === 'character' && en.firstPage <= page).slice(0, 60)
          .map(en => `- ${en.name}${en.aliases.size ? ' (also: ' + [...en.aliases].join(', ') + ')' : ''}${en.description ? ': ' + en.description : ''}`).join('\n') || '(none yet)';
        const r = await callText(`You are tagging dialogue for an audiobook of "${book.title}". Every quotation on this page is marked [Q1], [Q2] and so on just before it. Say who speaks each one.
- When the speaker is one of the KNOWN CHARACTERS, use that exact name (match nicknames, surnames and titles to them).
- If it's clearly a new named character, give the name as the text writes it. For an unnamed speaker, give a short label such as "the old man".
- If the quote isn't spoken dialogue (a sign, a title, a quoted word or phrase), use "narrator". If you can't tell, use "unknown".
- Use only this page and the list. Nothing from later in the book.
- Also give each speaker's gender when the text or list makes it clear: male, female or unknown.
Reply with JSON only, no fences: {"speakers":{"Q1":"Name"},"genders":{"Name":"female"}}

KNOWN CHARACTERS:
${known}

PAGE ${page}:
${marked.slice(0, 9000)}`, {modelTier: 'quick'});
        const t = (r && r.text) || ''; const a = t.indexOf('{'), b = t.lastIndexOf('}');
        let j = {}; try { j = JSON.parse(t.slice(a, b + 1)); } catch(e){ return; }
        const map = {}, genders = {};
        qs.forEach((q, i) => { const n = j.speakers && j.speakers['Q' + (i + 1)]; if (n) map[q.p + ':' + q.s] = CAST_SKIP.test(String(n)) ? String(n).toLowerCase() : resolveName(n); });
        Object.entries(j.genders || {}).forEach(([n, g]) => { if (/^(male|female)$/i.test(g)) genders[resolveName(n)] = g.toLowerCase(); });
        doc = {page, map, genders};
        if (db) try { await bref().collection('cast').doc('p' + page).set(doc); } catch(e){}
      }
    }
    if (!book || book.id !== bid) return;
    castCache.set(page, doc);
    let changed = false;
    Object.entries(doc.genders || {}).forEach(([n, g]) => { if (!book.genders[n]){ book.genders[n] = g; changed = true; } });
    if (changed) saveVoices();
    if (page === P && !tts.on) renderText();
  } catch(e){ aiError(e); }
  finally { castBusy.delete(page); }
}
/* voices */
const FEMALE_V = /\b(ava|emma|jenny|aria|michelle|ana|sonia|libby|maisie|natasha|clara|sara|nancy|jane|amber|ashley|cora|elizabeth|monica|samantha|karen|moira|tessa|fiona|victoria|zira|susan|hazel|catherine|linda|heather|emily|olivia|sophie|isabella|serena|allison|joanna|kendra|kimberly|salli|ivy|ruth|leah|molly|hayley|evelyn|jessa|nova|ellie|aubrey|abbi|bella|hollie|maya|ada|sienna)\b/i;
const MALE_V = /\b(andrew|brian|guy|christopher|eric|roger|steffan|davis|tony|jason|ryan|thomas|william|liam|mitchell|daniel|fred|alex|aaron|arthur|george|oliver|james|david|mark|richard|paul|matthew|joey|justin|kevin|stephen|russell|ralph|albert|bruce|connor|elliot|ethan|noah|reed|rocko|eddy|lewis|brandon|derek|dustin|adam|alfie|ollie|ethan|noah|wayne|neil|tim)\b/i;
function voiceGender(v){ const n = v.name; if (/female/i.test(n)) return 'female'; if (/\bmale\b/i.test(n)) return 'male'; return FEMALE_V.test(n) ? 'female' : MALE_V.test(n) ? 'male' : 'unknown'; }
function englishVoices(){ const vs = ('speechSynthesis' in window) ? speechSynthesis.getVoices() : []; const en = vs.filter(v => /^en/i.test(v.lang)); return en.length ? en : vs; }
function voicePool(){ const en = englishVoices(); const nat = en.filter(v => /natural|online|neural|premium|enhanced/i.test(v.name)); return nat.length >= 3 ? nat : en; }
const saveVoices = debounce(async () => { if (db && book) try { await bref().update({voices: book.voices, genders: book.genders}); } catch(e){} }, 800);
function voiceFor(name){
  if (!book.voices[name] || !speechSynthesis.getVoices().some(v => v.voiceURI === book.voices[name].voice)){
    const pool = voicePool().filter(v => v.voiceURI !== settings.voice); if (!pool.length) return null;
    const g = book.genders[name] || 'unknown';
    const fit = pool.filter(v => g === 'unknown' || voiceGender(v) === g); const cands = fit.length ? fit : pool;
    const used = {}; Object.values(book.voices).forEach(x => { used[x.voice] = (used[x.voice] || 0) + 1; });
    const pick = cands.slice().sort((a, b) => (used[a.voiceURI] || 0) - (used[b.voiceURI] || 0))[0];
    const n = used[pick.voiceURI] || 0;
    book.voices[name] = {voice: pick.voiceURI, pitch: [1, 0.85, 1.15, 0.75, 1.25][n % 5]};
    saveVoices();
  }
  const set = book.voices[name];
  return {voice: speechSynthesis.getVoices().find(v => v.voiceURI === set.voice), pitch: set.pitch || 1};
}
function speakerDialog(q){
  const chars = [...new Set([...book.entities.filter(en => en.type === 'character' && en.firstPage <= P).map(en => en.name), ...Object.keys(book.voices)])].sort((a, b) => a.localeCompare(b));
  const ov = $('#overlay');
  ov.innerHTML = `<div class="scrim" data-close></div><div class="modal" role="dialog" aria-modal="true" aria-labelledby="spT"><b id="spT">Who says this?</b><div class="muted" style="font-family:Literata,serif">${esc(q.text.length > 140 ? q.text.slice(0, 140) + '…' : q.text)}</div>
    <div style="display:flex;flex-wrap:wrap;gap:6px;max-height:40vh;overflow:auto">${chars.map(c => `<button class="btn small" data-who="${esc(c)}"${c === q.speaker ? ' style="border-color:#1F5E8C;color:#1F5E8C"' : ''}>${esc(c)}</button>`).join('')}<button class="btn small" data-who="narrator">Narrator</button></div>
    <label for="spNew" class="muted" style="font-size:13px">Someone else</label><input class="search" id="spNew" placeholder="Type a name"><div class="row"><button class="btn" data-close>Cancel</button><button class="btn primary" id="spOk">Save</button></div></div>`;
  ov.querySelectorAll('[data-close]').forEach(x => x.onclick = closeOverlay);
  const save = async name => {
    const doc = castCache.get(P) || {page: P, map: {}}; doc.map = {...(doc.map || {}), [q.p + ':' + q.s]: name === 'narrator' ? 'narrator' : resolveName(name)}; doc.fixed = true;
    castCache.set(P, doc); if (db) try { await bref().collection('cast').doc('p' + P).set(doc); } catch(e){}
    closeOverlay(); renderText(); toast('Speaker updated');
  };
  ov.querySelectorAll('[data-who]').forEach(b => b.onclick = () => save(b.dataset.who));
  $('#spOk').onclick = () => { const v = $('#spNew').value.trim(); if (v) save(v); };
}

/* Memory card */
const recapCache = new Map();
function openCard(id){
  const en = book.entities.find(x => x.id === id);
  if (!en || en.firstPage > P) return;
  const facts = en.facts.filter(f => f.page <= P);
  const aliases = [...en.aliases].filter(a => a.toLowerCase() !== en.name.toLowerCase());
  const label = {character:'Character', place:'Place', event:'Event', group:'Group', thing:'Thing'}[en.type] || 'Thing';
  const body = panel(en.name, `
    <div class="muted" style="margin-top:-8px;font-size:14px">${label} · first appears on page ${en.firstPage}${aliases.length ? ' · also called ' + esc(aliases.join(', ')) : ''}</div>
    <div class="shield">${svgI('lock')}<span><strong>Spoiler shield on.</strong> Only what you’ve read, through page ${P}.</span></div>
    ${en.description && en.descPage <= P ? `<div style="display:flex;flex-direction:column;gap:8px"><h3 class="h3">Who or what</h3><p class="desc">${esc(en.description)}</p></div>` : ''}
    <div style="display:flex;flex-direction:column;gap:8px"><h3 class="h3">So far</h3><div class="facts">${facts.map(f => `<div class="fact"><button data-pg="${f.page}" aria-label="Go to page ${f.page}">p. ${f.page}</button><span>${esc(f.text)}</span></div>`).join('') || '<span class="muted">No notes yet.</span>'}</div></div>
    ${facts.length >= 3 && aiReady() ? `<div style="display:flex;flex-direction:column;gap:8px"><button class="btn" id="recapBtn" style="align-self:flex-start">Catch me up</button><p class="desc" id="recapT" hidden></p></div>` : ''}
    ${settings.castOn && en.type === 'character' && 'speechSynthesis' in window ? `<div style="display:flex;flex-direction:column;gap:8px"><h3 class="h3">Voice</h3><div class="seg" style="flex-wrap:wrap"><select id="cvSel" aria-label="Voice for ${esc(en.name)}" style="height:44px;border:1px solid #E3DED2;border-radius:10px;padding:0 8px;max-width:100%">${englishVoices().map(v => `<option value="${esc(v.voiceURI)}">${esc(v.name.replace(/^Microsoft /, '').replace(/ - .*$/, ''))}</option>`).join('')}</select><select id="cvPitch" aria-label="Pitch" style="height:44px;border:1px solid #E3DED2;border-radius:10px;padding:0 8px"><option value="0.8">Lower</option><option value="1">Normal</option><option value="1.2">Higher</option></select><button class="btn small" id="cvPlay">${svgI('speak').replace('<svg', '<svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.8"')}Hear it</button></div></div>` : ''}
    <p class="muted" style="font-size:13px;margin:0">More unlocks as you keep reading.</p>`);
  if ($('#cvSel')){
    const cur = voiceFor(en.name); const sel = $('#cvSel'), pit = $('#cvPitch');
    if (cur && cur.voice) sel.value = cur.voice.voiceURI;
    const pv = cur ? cur.pitch : 1; pit.value = pv < 0.9 ? '0.8' : pv > 1.1 ? '1.2' : '1';
    const store = () => { book.voices[en.name] = {voice: sel.value, pitch: Number(pit.value)}; saveVoices(); };
    sel.onchange = store; pit.onchange = store;
    $('#cvPlay').onclick = () => { stopTts(); const u = new SpeechSynthesisUtterance(`Hello. I'm ${en.name}.`); const v = speechSynthesis.getVoices().find(x => x.voiceURI === sel.value); if (v) u.voice = v; u.pitch = Number(pit.value); u.rate = settings.rate; speechSynthesis.speak(u); };
  }
  body.querySelectorAll('[data-pg]').forEach(b => b.onclick = () => { closeOverlay(); goPage(+b.dataset.pg); });
  const rb = $('#recapBtn');
  if (rb) rb.onclick = async () => {
    const key = en.id + ':' + facts.length, out = $('#recapT');
    if (recapCache.has(key)){ out.hidden = false; out.textContent = recapCache.get(key); return; }
    rb.disabled = true; rb.textContent = 'Thinking…';
    try {
      const r = await sample(`Write a 2–3 sentence recap of "${en.name}" for someone reading "${book.title}". Use ONLY these notes from what they have read so far. Add nothing else, even if you know the book.\n\n${en.description ? 'Intro: ' + en.description + '\n' : ''}${facts.map(f => `p.${f.page}: ${f.text}`).join('\n')}\n\nReply with just the recap.`, {modelTier: 'quick'});
      const t = String((r && r.text) || '').trim(); recapCache.set(key, t);
      if (out.isConnected){ out.hidden = false; out.textContent = t; rb.remove(); }
    } catch(e){ aiError(e); if (rb.isConnected){ rb.disabled = false; rb.textContent = 'Catch me up'; } toast('Couldn’t write a recap right now'); }
  };
}

boot();
})();
</script>
